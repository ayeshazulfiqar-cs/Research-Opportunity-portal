<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research Opportunity Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Research Opportunity Portal</h1>
  <div id="message"></div>

  <button id="newBtn">+ New opportunity</button>

  <!-- Form (create and update) -->
  <form id="form" class="box" hidden novalidate>
    <h2 id="formTitle">New opportunity</h2>
    <div id="formErrors"></div>

    <label>Research title *</label>
    <input id="title">
    <label>Research description *</label>
    <textarea id="description" rows="3"></textarea>
    <label>Research area *</label>
    <input id="research_area">
    <label>Faculty member's name *</label>
    <input id="faculty_name">
    <label>Department *</label>
    <input id="department">
    <label>Required skills *</label>
    <input id="required_skills" placeholder="e.g. Python, Statistics">
    <label>Available positions *</label>
    <input id="available_positions" type="number" min="1">
    <label>Application deadline *</label>
    <input id="application_deadline" type="date">
    <label>Status</label>
    <select id="status"><option>Open</option><option>Closed</option></select>

    <button type="submit">Save</button>
    <button type="button" id="cancelBtn">Cancel</button>
  </form>

  <!-- Details of the selected opportunity -->
  <div id="details" class="box" hidden></div>

  <!-- All opportunities -->
  <h2>All opportunities</h2>
  <table>
    <thead>
      <tr><th>Title</th><th>Faculty</th><th>Deadline</th><th>Status</th><th></th></tr>
    </thead>
    <tbody id="list"></tbody>
  </table>

  <script src="script.js"></script>
</body>
</html>
